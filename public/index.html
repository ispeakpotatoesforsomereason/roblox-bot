<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ SIGMA SLICERS C2</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --panel: #0d111a;
            --panel-border: #1a202c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --success: #10b981;
            --danger: #ef4444;
            --text: #f3f4f6;
            --muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            padding: 24px 16px;
            max-width: 680px;
            margin: 0 auto;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15), transparent 40%),
                linear-gradient(to bottom, transparent, rgba(0,0,0,0.4));
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 16px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 10px;
            color: var(--muted);
            margin-top: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a5b4fc;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            background: #04060a;
            border: 1px solid var(--panel-border);
            color: #fff;
            border-radius: 6px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        button {
            width: 100%;
            padding: 10px 14px;
            margin-top: 10px;
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-sm {
            width: auto;
            padding: 4px 8px;
            margin-top: 0;
            font-size: 10px;
            background: #161b26;
            color: #a5b4fc;
            border: 1px solid var(--panel-border);
        }

        .btn-sm:hover {
            background: #21293a;
        }

        .btn-success {
            background: var(--success);
        }
        .btn-success:hover {
            background: #059669;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.25);
        }

        /* Bot List Table */
        .table-container {
            overflow-x: auto;
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            background: #04060a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--muted);
            text-align: left;
            padding: 8px 12px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--panel-border);
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .checkbox-custom {
            width: 15px;
            height: 15px;
            accent-color: var(--accent);
            cursor: pointer;
            vertical-align: middle;
        }

        #tempCodeDisplay {
            margin-top: 10px;
            font-size: 11px;
            color: var(--success);
            text-align: center;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ SIGMA SLICERS C2</div>
        <div class="subtitle">BOTNET COMMAND & CONTROL SYSTEM</div>
    </header>

    <div class="card">
        <label for="authKey">AUTHENTICATION</label>
        <input type="password" id="authKey" placeholder="Enter Admin Password or Temp Code..." oninput="refreshBots()">
    </div>

    <div class="card">
        <div class="card-header">
            <h3>🤖 ACTIVE BOTS</h3>
            <div style="display: flex; gap: 6px;">
                <button class="btn-sm" type="button" onclick="selectAllBots(true)">ALL</button>
                <button class="btn-sm" type="button" onclick="selectAllBots(false)">NONE</button>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 32px;">SEL</th>
                        <th>USERNAME</th>
                        <th style="text-align: right;">TIME STAT</th>
                    </tr>
                </thead>
                <tbody id="botTableBody">
                    <tr><td colspan="3" style="color: var(--muted); text-align: center;">enter auth key to link dashboard...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h3>🚨 RAID CHAT COMMAND</h3>
        <input type="text" id="raidText" value="YOU GOT RAIDED BY SIGMA SLICERS 🔥" style="margin-top: 10px;">
        <button onclick="sendCommand('raid', { text: document.getElementById('raidText').value })">DISPATCH RAID MESSAGE</button>
    </div>

    <div class="card">
        <h3>📍 TELEPORT TO PLAYER</h3>
        <input type="text" id="targetPlayer" placeholder="Target Username..." style="margin-top: 10px;">
        <button onclick="sendCommand('teleport', { target: document.getElementById('targetPlayer').value })">TELEPORT BOTS</button>
    </div>

    <div class="card">
        <h3>💸 DONATE ALL BOTS</h3>
        <input type="number" id="donateAmount" value="10" placeholder="Amount..." style="margin-top: 10px;">
        <button onclick="sendCommand('donate_all', { amount: document.getElementById('donateAmount').value })">START DONATING</button>
    </div>

    <div class="card">
        <h3>🌐 SERVER HOP</h3>
        <div class="input-group" style="margin-top: 10px;">
            <input type="text" id="placeId" placeholder="Place ID">
            <input type="text" id="jobId" placeholder="Job ID (Optional)">
        </div>
        <button onclick="sendCommand('join_server', { placeId: document.getElementById('placeId').value, jobId: document.getElementById('jobId').value })">TELEPORT TO SERVER</button>
    </div>

    <div class="card">
        <h3>🔑 GENERATE TEMP ACCESS CODE</h3>
        <button class="btn-success" onclick="generateTempCode()">CREATE 10-MIN CODE</button>
        <p id="tempCodeDisplay"></p>
    </div>

    <script>
        const selectedBots = new Set();

        async function refreshBots() {
            const auth = document.getElementById('authKey').value;
            if (!auth) {
                document.getElementById('botTableBody').innerHTML = '<tr><td colspan="3" style="color: var(--muted); text-align: center;">enter auth key to link dashboard...</td></tr>';
                return;
            }

            try {
                const res = await fetch('/api/bots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auth })
                });

                const data = await res.json();
                if (!data.success) return;

                const tbody = document.getElementById('botTableBody');
                if (data.bots.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="color: var(--muted); text-align: center;">no bots connected</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.bots.forEach(bot => {
                    const isChecked = selectedBots.has(bot.username);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <input type="checkbox" class="checkbox-custom" value="${bot.username}" ${isChecked ? 'checked' : ''} onchange="toggleBot('${bot.username}', this.checked)">
                        </td>
                        <td><strong>${bot.username}</strong></td>
                        <td style="text-align: right;"><span class="badge">${bot.time}s</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("error fetching bots:", e);
            }
        }

        function toggleBot(username, isChecked) {
            if (isChecked) {
                selectedBots.add(username);
            } else {
                selectedBots.delete(username);
            }
        }

        function selectAllBots(checkAll) {
            const checkboxes = document.querySelectorAll('#botTableBody input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = checkAll;
                toggleBot(cb.value, checkAll);
            });
        }

        async function sendCommand(action, payload) {
            const auth = document.getElementById('authKey').value;
            const targets = selectedBots.size > 0 ? Array.from(selectedBots) : null;

            const res = await fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ auth, action, payload, targets })
            });

            const data = await res.json();
            alert(data.success ? `Command delivered to ${data.deliveredBots} bots` : `Error: ${data.error}`);
        }

        async function generateTempCode() {
            const password = document.getElementById('authKey').value;
            const res = await fetch('/api/create-temp-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            const data = await res.json();
            if (data.code) {
                document.getElementById('tempCodeDisplay').innerText = `TEMP CODE: ${data.code} (Expires in 10m)`;
            } else {
                alert(`Error: ${data.error}`);
            }
        }

        setInterval(refreshBots, 2000);
    </script>
</body>
</html>
